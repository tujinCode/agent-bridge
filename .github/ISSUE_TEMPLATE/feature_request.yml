name: Feature request
description: Propose a capability, starting from the problem it solves
labels: [ "enhancement", "needs-triage" ]
body:
  - type: markdown
    attributes:
      value: |
        Check the [roadmap](https://github.com/tujinCode/agent-bridge#roadmap) first — if the
        capability is already planned, say which item it belongs to. If it is not planned,
        that is fine: this issue is where it gets discussed and decided.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: Describe the situation, not the solution. What are you unable to do today?
      placeholder: |
        Our agents run inside a multi-tenant SaaS. Two tenants have a tool with the same
        name but different permission sets, and the registry cannot tell them apart.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: If you have one. Sketch the API you wish existed.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Including "do nothing" — sometimes the right answer is a listener or a wrapper, not a core feature.

  - type: dropdown
    id: stage
    attributes:
      label: Which stage does this belong to
      options:
        - v0.5.0 (V1 - production readiness)
        - v0.9.0 (V1.5 - long-term maintenance)
        - v1.0.0 (V2 - ecosystem)
        - Not sure
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Confirm it is in scope
      options:
        - label: This is not agent orchestration, prompt management, RAG or a vector store (explicitly out of scope)
          required: true
